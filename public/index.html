<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVAC Showdown · ASHRAE RIT Dubai</title>
<link rel="icon" href="/ashrae-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="host">
<canvas id="bg3d" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div id="warn" class="banner bad" hidden>Shared storage is not connected, so phones won't sync on Vercel. Add Upstash Redis in the Vercel dashboard (see README) and redeploy.</div>
<div id="conn" class="banner warn" hidden>Reconnecting…</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<header class="topbar">
  <div class="brand">
    <div class="logo-tile"><img src="/ashrae-logo.png" width="150" height="150" alt="ASHRAE Rochester Institute of Technology, Dubai Student Branch"></div>
    <div class="brand-txt">
      <div class="label">ASHRAE · Rochester Institute of Technology, Dubai · Student Branch</div>
      <div class="brand-t">HVAC SHOWDOWN</div>
    </div>
  </div>
  <div class="hud" id="hud"></div>
</header>

<main class="arena">
  <section class="pcard p1" id="card1" aria-label="Player 1"></section>
  <section class="stage" id="stage" aria-live="polite"></section>
  <section class="pcard p2" id="card2" aria-label="Player 2"></section>
</main>

<footer class="foot">
  <div class="rules label">First to <b>3 correct</b> wins · up to <b>10</b> questions · tie → <b>faster total time</b></div>
  <div class="ctrls">
    <button id="bStart" class="btn primary">Start <kbd>Space</kbd></button>
    <button id="bNext" class="btn">Skip <kbd>→</kbd></button>
    <button id="bNew" class="btn">New match <kbd>N</kbd></button>
    <button id="bFs" class="btn" aria-label="Fullscreen">Fullscreen <kbd>F</kbd></button>
  </div>
</footer>

<script type="module" src="/host.js"></script>
</body>
</html>
